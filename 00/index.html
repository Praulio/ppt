<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#110e0c">
  <title>Corazón inquieto · presentación remasterizada</title>
  <style>
    :root { --night:#110e0c; --gold:#e1b768; --cream:#fbf3e4; --soft:#d9c9b3; --serif:"Iowan Old Style",Baskerville,"Palatino Linotype",Palatino,Georgia,serif; --sans:"Avenir Next","Helvetica Neue",Arial,sans-serif; }
    * { box-sizing:border-box; } [hidden] { display:none !important; } html,body { width:100%; height:100%; margin:0; background:#050403; }
    body { overflow:hidden; color:var(--cream); font-family:var(--sans); } button { font:inherit; }
    .stage { position:relative; width:100vw; height:100dvh; overflow:hidden; }
    .frame { position:absolute; top:50%; left:50%; width:min(100vw,177.7778dvh); height:min(56.25vw,100dvh); transform:translate(-50%,-50%); overflow:hidden; background:var(--night); isolation:isolate; box-shadow:0 20px 80px #0009; container-type:inline-size; }
    .painting { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; opacity:1; transition:opacity .4s ease; }
    .painting.loading { opacity:0; }
    .veil { position:absolute; inset:0; background:linear-gradient(90deg,rgba(9,8,7,.93),rgba(9,8,7,.77) 33%,rgba(9,8,7,.22) 70%,rgba(9,8,7,.06)),linear-gradient(0deg,rgba(9,8,7,.42),transparent 48%); }
    .centered .veil { background:radial-gradient(ellipse at center,rgba(9,8,7,.82),rgba(9,8,7,.46) 48%,rgba(9,8,7,.2)); }
    .right-copy .veil { background:linear-gradient(270deg,rgba(9,8,7,.93),rgba(9,8,7,.76) 33%,rgba(9,8,7,.12) 75%); }
    .frame::after { content:""; position:absolute; inset:2.2%; border:1px solid #fff3; pointer-events:none; }
    .grain { position:absolute; inset:0; pointer-events:none; opacity:.1; mix-blend-mode:soft-light; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
    .meta { position:absolute; z-index:2; top:5.7%; left:7.2%; right:7.2%; display:flex; justify-content:space-between; gap:2rem; color:#f3e5d0c9; font-size:clamp(14px,1.2cqw,25px); font-weight:800; letter-spacing:.17em; text-transform:uppercase; }
    .meta .count { color:var(--gold); white-space:nowrap; }
    .copy { position:absolute; z-index:2; left:7.2%; bottom:13%; width:58%; max-height:74%; display:flex; flex-direction:column; justify-content:flex-end; }
    .centered .copy { left:11%; width:78%; bottom:24%; align-items:center; text-align:center; }
    .right-copy .copy { left:auto; right:7.2%; width:54%; }
    h1 { margin:0; max-width:14em; font-family:var(--serif); font-size:clamp(50px,6.3cqw,126px); font-weight:400; line-height:.94; letter-spacing:-.035em; text-wrap:balance; text-shadow:0 3px 25px #0007; }
    .hero h1 { font-size:clamp(65px,7.7cqw,154px); } h1 em { color:var(--gold); font-style:normal; }
    .subtitle { margin:2.2cqw 0 0; max-width:21em; color:var(--soft); font-family:var(--serif); font-size:clamp(28px,2.6cqw,53px); line-height:1.13; text-wrap:balance; text-shadow:0 2px 18px #000; }
    .quote { margin:2.4cqw 0 0; max-width:23em; color:var(--cream); font-family:var(--serif); font-size:clamp(30px,3cqw,61px); font-style:italic; line-height:1.12; text-wrap:balance; text-shadow:0 2px 20px #000; }
    .attribution { margin:1.2cqw 0 0; color:var(--gold); font-size:clamp(17px,1.4cqw,29px); font-weight:700; letter-spacing:.07em; }
    .list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.8cqw 2.3cqw; margin:2.2cqw 0 0; padding:0; list-style:none; max-width:22em; }
    .list li { border-left:3px solid var(--gold); padding:.15em 0 .15em .6em; color:var(--cream); font-family:var(--serif); font-size:clamp(25px,2.4cqw,49px); line-height:1.08; }
    .list.compact li { font-size:clamp(22px,2.03cqw,42px); }
    .small-title h1 { font-size:clamp(48px,5.2cqw,104px); } .small-copy .subtitle { font-size:clamp(25px,2.18cqw,44px); } .quote-heavy .copy { width:72%; } .quote-heavy h1 { font-size:clamp(46px,4.7cqw,96px); } .quote-heavy .quote { font-size:clamp(27px,2.55cqw,52px); }
    .lineage { display:flex; gap:1.2cqw; flex-wrap:wrap; max-width:28em; margin-top:2.4cqw; }
    .lineage span { padding:.45em .65em; border:1px solid #e1b76899; background:#130e0bbd; font-size:clamp(20px,1.7cqw,35px); font-weight:700; }
    .notes-panel { display:none; position:absolute; z-index:10; right:4%; bottom:8%; width:42%; max-height:45%; overflow:auto; padding:1.4cqw; border-top:3px solid var(--gold); background:#110e0cf5; box-shadow:0 12px 35px #0008; }
    .notes-panel.open { display:block; } .notes-panel h2 { margin:0 0 .7rem; color:var(--gold); font-size:clamp(17px,1.2cqw,25px); letter-spacing:.1em; text-transform:uppercase; }
    .notes-panel p { margin:0; font-family:var(--serif); font-size:clamp(23px,1.8cqw,37px); line-height:1.3; }
    .progress { position:absolute; z-index:11; left:0; right:0; bottom:0; height:4px; pointer-events:none; }
    .progress span { display:block; width:3.333%; height:100%; background:var(--gold); transition:width .25s ease; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media(max-width:700px) { .meta { font-size:1.4cqw; } .copy { bottom:11%; } h1 { font-size:6.2cqw; } .hero h1 { font-size:7.5cqw; } .subtitle { font-size:2.6cqw; } .quote { font-size:3cqw; } .list li { font-size:2.3cqw; } }
    @media(prefers-reduced-motion:reduce) { .painting,.progress span { transition:none; } }
  </style>
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
  <main class="stage" aria-label="Corazón inquieto, presentación de 30 láminas">
    <div class="frame hero" id="frame">
      <img class="painting loading" id="painting" alt=""><div class="veil"></div><div class="grain"></div>
      <div class="meta"><span id="chapter"></span><span class="count" id="count"></span></div>
      <div class="copy"><h1 id="title"></h1><p class="subtitle" id="subtitle"></p><blockquote class="quote" id="quote"></blockquote><p class="attribution" id="attribution"></p><ul class="list" id="list"></ul><div class="lineage" id="lineage"></div></div>
      <div class="notes-panel" id="notes"><h2>Notas para presentar</h2><p id="notes-text"></p></div>
      <div class="progress" aria-hidden="true"><span id="progress-fill"></span></div>
    </div>
    <button class="sr-only" id="previous" type="button">Lámina anterior</button><button class="sr-only" id="next" type="button">Lámina siguiente</button>
  </main>
  <script src="remaster.js"></script>
  <script>
    const slides=window.CORAZON_REMASTER, $=id=>document.getElementById(id);
    let current=0;
    const warmed=new Set(), imageUrl=n=>`assets/remaster-${String(n+1).padStart(2,'0')}.jpg${n===13?'?v=2':''}`;
    function warm(n) { if(n<0||n>=slides.length||warmed.has(n)) return; const img=new Image(); img.src=imageUrl(n); warmed.add(n); }
    function show(index,replace=false) {
      current=Math.max(0,Math.min(slides.length-1,index));
      $('frame').scrollTop=0;
      const slide=slides[current],painting=$('painting');
      $('frame').className=`frame ${slide.style||''}`;
      painting.classList.add('loading'); painting.onload=()=>painting.classList.remove('loading'); painting.src=imageUrl(current);
      painting.alt=`Pintura de la lámina ${current+1}: ${slide.title.replace(/<[^>]*>/g,'')}`;
      $('chapter').textContent=slide.chapter; $('count').textContent=`${String(current+1).padStart(2,'0')} / ${slides.length}`;
      $('title').innerHTML=slide.title;
      for(const key of ['subtitle','quote','attribution']) { $(key).textContent=slide[key]||''; $(key).hidden=!slide[key]; }
      $('list').replaceChildren(...(slide.list||[]).map(item=>{const li=document.createElement('li'); li.textContent=item; return li;}));
      $('list').hidden=!slide.list; $('list').classList.toggle('compact',(slide.list||[]).length>6);
      $('lineage').replaceChildren(...(slide.lineage||[]).map(item=>{const span=document.createElement('span'); span.textContent=item; return span;}));
      $('lineage').hidden=!slide.lineage;
      $('notes-text').textContent=slide.notes;
      $('progress-fill').style.width=`${(current+1)/slides.length*100}%`;
      const hash=`#slide=${current+1}`; if(location.hash!==hash) history[replace?'replaceState':'pushState'](null,'',hash);
      document.title=`${current+1}/${slides.length} · Corazón inquieto`; warm(current+1); warm(current+2);
    }
    function fromHash(){const value=Number((location.hash.match(/slide=(\d+)/)||[])[1]);show(value>0?value-1:0,true);}
    $('previous').addEventListener('click',()=>show(current-1)); $('next').addEventListener('click',()=>show(current+1));
    addEventListener('keydown',event=>{
      if(['ArrowRight','ArrowDown','PageDown',' '].includes(event.key)){event.preventDefault();show(current+1);}
      else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(event.key)){event.preventDefault();show(current-1);}
      else if(event.key==='Home')show(0); else if(event.key==='End')show(slides.length-1);
      else if(event.key.toLowerCase()==='f'){if(!document.fullscreenElement)$('frame').requestFullscreen?.();else document.exitFullscreen?.();}
      else if(event.key.toLowerCase()==='n')$('notes').classList.toggle('open');
      else if(event.key==='Escape')$('notes').classList.remove('open');
    });
    $('frame').addEventListener('click',event=>{if(matchMedia('(max-width:900px) and (orientation:portrait), (max-height:550px) and (max-width:1000px)').matches||event.target.closest('.notes-panel'))return;const rect=$('frame').getBoundingClientRect();show(current+(event.clientX<rect.left+rect.width/2?-1:1));});
    addEventListener('hashchange',fromHash);addEventListener('popstate',fromHash);fromHash();
  </script>
</body>
</html>
