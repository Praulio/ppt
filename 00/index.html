<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>Corazón inquieto · Del Ocultismo a Cristo</title>
    <link rel="preload" as="image" href="assets/slide-01.jpeg" />
    <style>
      :root { color-scheme: dark; --gold: #d4af37; --cream: #f5e6d3; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; background: #080807; overflow: hidden; }
      body { display: grid; place-items: center; font-family: Georgia, 'Times New Roman', serif; }
      .presentation { position: relative; width: min(100vw, 177.77778vh); aspect-ratio: 16 / 9; overflow: hidden; background: #1a1a1a; container-type: inline-size; user-select: none; cursor: default; }
      .slide { position: absolute; inset: 0; overflow: hidden; opacity: 0; visibility: hidden; transition: opacity .3s ease, visibility .3s ease; }
      .slide.is-active { opacity: 1; visibility: visible; z-index: 1; }
      .slide img, .slide .overlay, .slide .copy { position: absolute; }
      .slide img { display: block; object-fit: fill; max-width: none; }
      .slide .copy { display: flex; flex-direction: column; justify-content: flex-start; overflow: visible; text-shadow: 0 .12cqw 1.1cqw rgba(0, 0, 0, .63); }
      .slide .copy.is-centered { justify-content: center; }
      .slide .copy p { margin: 0; line-height: 1.12; white-space: pre-line; }
      .slide .copy span { font-family: Georgia, 'Times New Roman', serif; }
      .progress { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; z-index: 20; pointer-events: none; }
      .progress span { display: block; width: 0; height: 100%; background: var(--gold); transition: width .25s ease; }
      .notes { position: absolute; z-index: 30; left: 4%; right: 4%; bottom: 5%; max-height: 34%; overflow: auto; display: none; padding: 1.2rem 1.5rem; border: 1px solid rgba(212,175,55,.5); background: rgba(16,14,12,.96); color: var(--cream); font: clamp(1rem, 2cqw, 1.55rem)/1.45 Georgia, serif; box-shadow: 0 1rem 3rem rgba(0,0,0,.45); }
      .notes.is-open { display: block; }
      .notes .label { margin: 0 0 .35rem; color: var(--gold); font-family: sans-serif; font-size: .8em; letter-spacing: .08em; text-transform: uppercase; }
      .notes p:last-child { margin: 0; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
      @media (prefers-reduced-motion: reduce) { .slide, .progress span { transition: none; } }
    </style>
  </head>
  <body>
    <main class="presentation" id="presentation" aria-label="Presentación Corazón inquieto">
      <div id="slides"></div>
      <div class="progress" aria-hidden="true"><span id="progress"></span></div>
      <aside class="notes" id="notes" aria-hidden="true">
        <p class="label" id="notesLabel"></p>
        <p id="notesText"></p>
      </aside>
      <span class="sr-only" id="announcement" aria-live="polite"></span>
    </main>
    <script src="slides.js"></script>
    <script>
      (() => {
        const data = window.CORAZON_SLIDES;
        const canvas = document.getElementById('presentation');
        const slidesHost = document.getElementById('slides');
        const progress = document.getElementById('progress');
        const notes = document.getElementById('notes');
        const notesLabel = document.getElementById('notesLabel');
        const notesText = document.getElementById('notesText');
        const announcement = document.getElementById('announcement');
        const slides = [];
        let current = 0;

        function place(node, box) {
          node.style.left = `${box.x}%`;
          node.style.top = `${box.y}%`;
          node.style.width = `${box.w}%`;
          node.style.height = `${box.h}%`;
        }

        for (const item of data) {
          const slide = document.createElement('section');
          slide.className = 'slide';
          slide.style.background = item.background;
          slide.setAttribute('aria-label', `Lámina ${item.number} de ${data.length}`);
          slide.setAttribute('aria-hidden', 'true');
          for (const element of item.elements) {
            if (element.type === 'image') {
              const image = document.createElement('img');
              image.src = element.src;
              image.alt = '';
              image.draggable = false;
              image.style.opacity = element.opacity;
              place(image, element.box);
              slide.append(image);
            } else if (element.type === 'rectangle') {
              const overlay = document.createElement('div');
              overlay.className = 'overlay';
              overlay.style.background = element.color;
              overlay.style.opacity = element.opacity;
              place(overlay, element.box);
              slide.append(overlay);
            } else if (element.type === 'text') {
              const copy = document.createElement('div');
              copy.className = element.anchor === 'ctr' ? 'copy is-centered' : 'copy';
              place(copy, element.box);
              for (const paragraph of element.paragraphs) {
                const line = document.createElement('p');
                line.style.textAlign = { ctr: 'center', r: 'right', l: 'left' }[paragraph.align] || 'left';
                for (const run of paragraph.runs) {
                  const span = document.createElement('span');
                  span.textContent = run.text;
                  span.style.fontSize = `${run.size / 720 * 100}cqw`;
                  span.style.fontWeight = run.bold ? '700' : '400';
                  span.style.fontStyle = run.italic ? 'italic' : 'normal';
                  span.style.color = run.color;
                  if (run.color.toLowerCase() === '#3e2723') span.style.textShadow = 'none';
                  line.append(span);
                }
                copy.append(line);
              }
              slide.append(copy);
            }
          }
          slidesHost.append(slide);
          slides.push(slide);
        }

        function fromHash() {
          const match = location.hash.match(/^#slide=(\d+)$/);
          return match ? Math.min(Math.max(Number(match[1]) - 1, 0), slides.length - 1) : 0;
        }

        function show(index, changeUrl = true) {
          current = Math.min(Math.max(index, 0), slides.length - 1);
          slides.forEach((slide, i) => {
            slide.classList.toggle('is-active', i === current);
            slide.setAttribute('aria-hidden', String(i !== current));
          });
          progress.style.width = `${(current + 1) / slides.length * 100}%`;
          announcement.textContent = `Lámina ${current + 1} de ${slides.length}`;
          notesLabel.textContent = `Lámina ${current + 1} de ${slides.length}`;
          const visibleCopy = [...slides[current].querySelectorAll('.copy p')]
            .map(line => line.textContent.trim()).filter(Boolean).join(' · ');
          notesText.textContent = visibleCopy || 'Lámina visual sin texto añadido.';
          if (changeUrl) history.replaceState(null, '', `#slide=${current + 1}`);
        }

        function toggleNotes() {
          const open = notes.classList.toggle('is-open');
          notes.setAttribute('aria-hidden', String(!open));
        }

        async function toggleFullscreen() {
          try {
            if (!document.fullscreenElement) await canvas.requestFullscreen();
            else await document.exitFullscreen();
          } catch (error) { console.warn('Pantalla completa no disponible.', error); }
        }

        canvas.addEventListener('click', event => {
          if (event.target.closest('.notes')) return;
          const bounds = canvas.getBoundingClientRect();
          show(current + (event.clientX - bounds.left < bounds.width * .35 ? -1 : 1));
        });
        document.addEventListener('keydown', event => {
          if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); show(current + 1); }
          if (['ArrowLeft', 'PageUp', 'Backspace'].includes(event.key)) { event.preventDefault(); show(current - 1); }
          if (event.key === 'Home') show(0);
          if (event.key === 'End') show(slides.length - 1);
          if (event.key.toLowerCase() === 'n') toggleNotes();
          if (event.key.toLowerCase() === 'f') toggleFullscreen();
        });
        window.addEventListener('hashchange', () => show(fromHash(), false));
        show(fromHash(), false);
      })();
    </script>
  </body>
</html>
